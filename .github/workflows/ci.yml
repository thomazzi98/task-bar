name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Assemble TaskBar.app
        run: scripts/build.sh --skip-tests

      - name: Check the bundle
        run: |
          codesign --verify --strict dist/TaskBar.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/TaskBar.app/Contents/Info.plist)" = "true"
          dist/TaskBar.app/Contents/MacOS/TaskBar --help

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: TaskBar.app
          path: dist/TaskBar.app
          if-no-files-found: error
